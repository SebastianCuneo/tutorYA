name: tutorya

x-entorno-app: &entorno-app
  DB_PORT: "5432"
  DB_USER: tutorya
  DB_PASSWORD: ${POSTGRES_PASSWORD:-tutorya}
  DB_NAME: tutorya
  JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar}
  PORT: "3000"
  REDIS_URL: redis://redis:6379
  APP_VERSION: ${APP_VERSION:-ut4}
  # Habilita /internal/fallas/* (inyección de fallas para las demos). false en producción.
  FALLAS_HABILITADAS: ${FALLAS_HABILITADAS:-true}

# Gatekeeper: dos redes. "borde" (la única con puertos publicados, solo Nginx) e "interna"
# (internal: true, sin salida al exterior) para servicios, bases y Redis.
networks:
  borde:
  interna:
    internal: true

services:
  # Bulkhead de datos: una base por servicio, cada una con su volumen. Si cae db-nucleo,
  # Reservas sigue atendiendo con db-reservas (y al revés).
  db-nucleo:
    networks: [interna]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutorya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutorya}
      POSTGRES_DB: tutorya
    volumes:
      - pgdata-nucleo:/var/lib/postgresql/data
      - ./db/init_nucleo.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorya -d tutorya"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-reservas:
    networks: [interna]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutorya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutorya}
      POSTGRES_DB: tutorya
    volumes:
      - pgdata-reservas:/var/lib/postgresql/data
      - ./db/init_reservas.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorya -d tutorya"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Caché (Cache-Aside) y almacén de configuración (External Configuration Store).
  redis:
    networks: [interna]
    image: redis:7-alpine
    # AOF: la config sobrevive a un reinicio de Redis (la caché se pierde, no importa).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Sin container_name, sin volúmenes y sin puertos publicados: permite --scale.
  # Gatekeeper: los servicios solo están en la red interna; el único acceso es Nginx.
  nucleo:
    networks: [interna]
    build:
      context: .
      dockerfile: nucleo/Dockerfile
    environment:
      <<: *entorno-app
      DB_HOST: db-nucleo
      RESERVAS_URL: http://reservas:3000
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:${GATEWAY_TLS_PORT:-8443}}
    depends_on:
      db-nucleo:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      replicas: 2

  reservas:
    networks: [interna]
    build:
      context: .
      dockerfile: reservas/Dockerfile
    environment:
      <<: *entorno-app
      DB_HOST: db-reservas
      NUCLEO_URL: http://nucleo:3000
    depends_on:
      db-reservas:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      replicas: 2

  # Gateway Offloading: genera un certificado autofirmado si no existe (one-shot).
  # Va en "borde" porque necesita salida a internet para instalar openssl.
  certs:
    networks: [borde]
    image: alpine:3.20
    volumes:
      - ./nginx/certs:/certs
    command:
      - sh
      - -c
      - |
        if [ -s /certs/tutorya.crt ] && [ -s /certs/tutorya.key ]; then
          echo "certificado existente: no se regenera"
        else
          apk add --no-cache openssl >/dev/null &&
          openssl req -x509 -nodes -newkey rsa:2048 -days 365 -subj "/CN=localhost/O=TutorYa" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout /certs/tutorya.key -out /certs/tutorya.crt &&
          chmod 600 /certs/tutorya.key && echo "certificado autofirmado generado"
        fi

  nginx:
    networks: [borde, interna]
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
      - "${GATEWAY_TLS_PORT:-8443}:443"
    environment:
      GATEWAY_TLS_PORT: ${GATEWAY_TLS_PORT:-8443}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^GATEWAY_
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      nucleo:
        condition: service_healthy
      reservas:
        condition: service_healthy

volumes:
  pgdata-nucleo:
  pgdata-reservas:
  redisdata:
