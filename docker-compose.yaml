name: tutorya

x-entorno-app: &entorno-app
  DB_HOST: db
  DB_PORT: "5432"
  DB_USER: tutorya
  DB_PASSWORD: ${POSTGRES_PASSWORD:-tutorya}
  DB_NAME: tutorya
  JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar}
  PORT: "3000"
  REDIS_URL: redis://redis:6379
  APP_VERSION: ${APP_VERSION:-ut4}
  # Habilita /internal/fallas/* (inyección de fallas para las demos). false en producción.
  FALLAS_HABILITADAS: ${FALLAS_HABILITADAS:-true}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutorya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutorya}
      POSTGRES_DB: tutorya
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorya -d tutorya"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Caché (Cache-Aside) y almacén de configuración (External Configuration Store).
  redis:
    image: redis:7-alpine
    # AOF: la config sobrevive a un reinicio de Redis (la caché se pierde, no importa).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Sin container_name, sin volúmenes y sin puertos publicados: permite --scale.
  nucleo:
    build:
      context: .
      dockerfile: nucleo/Dockerfile
    environment:
      <<: *entorno-app
      RESERVAS_URL: http://reservas:3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${GATEWAY_PORT:-8080}}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      replicas: 2

  reservas:
    build:
      context: .
      dockerfile: reservas/Dockerfile
    environment:
      <<: *entorno-app
      NUCLEO_URL: http://nucleo:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      replicas: 2

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nucleo:
        condition: service_healthy
      reservas:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
